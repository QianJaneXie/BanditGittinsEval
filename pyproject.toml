[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gittins-bandit-eval"
version = "0.1.0"
description = "Cost-aware noisy bandit Gittins for efficient LLM evaluation and selection."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Qian Xie and collaborators" }]
dependencies = [
    "banditeval>=0.1.1",
    "numpy>=1.24",
]

# Script-only repo: wheel is metadata-only; use for dependency sync (e.g. pip install -e .).
[tool.setuptools]
packages = []

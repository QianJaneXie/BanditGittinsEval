[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gittins-bandit-eval"
version = "0.1.0"
description = "Cost-aware noisy bandit Gittins for efficient LLM evaluation and selection."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Qian Xie and collaborators" }]
dependencies = [
    "banditeval>=0.1.1",
    "botorch",
    "gpytorch",
    "jax>=0.4.26",
    "jaxtyping>=0.2.28",
    "matplotlib>=3.8",
    "numpy>=1.24",
    "torch>=2.5.1",
]

# Editable install exposes modules under src/ (e.g. import q_estimation).
[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
    "q_estimation",
    "gittins_index_computation",
    "gittins_shrinking_posterior",
    "gittins_policy",
    "stable_pbgi",
]

program: scripts/plot_simple_regret_single_policy_wandb.py
name: GSM8KUCBBatchSizeSweep
method: grid

command:
  - ${env}
  - /scratch/yh6415/conda_envs/gittins/bin/python
  - ${program}
  - ${args}

metric:
  name: final_simple_regret
  goal: minimize

parameters:
  experiment:
    value: gsm8k_various_model

  dataset_tag:
    value: gsm8k

  matrix:
    value: data/BanditEval_matrices/gsm8k_1_samples_various_models_seed1.npy

  policy_variant:
    values:
      - ucb_B16
      - ucb_B32
      - ucb_B64

  seed:
    values: [0, 1, 2]

  eval_budget_fraction:
    value: 0.1

  ucb_a:
    value: 1

  original_cost_vector:
    value: data_analysis/pricing/gsm8k_various_models_configurations_price_ratio_1to2_rounded.json

  wandb_entity:
    value: EfficientLLMEval

  wandb_project:
    value: GittinsBanditEval

  wandb_group:
    value: gsm8k_ucb_batch_size

  wandb_mode:
    value: online